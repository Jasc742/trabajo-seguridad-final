server {
    listen 80;
    server_name localhost;
    client_max_body_size 50M;
    # Redirige todo el trafico HTTP a HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name localhost;

    # Permitir archivos de hasta 50MB en peticiones HTTP/HTTPS
    client_max_body_size 50M;

    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;

    # SEC-FIX: configuracion TLS endurecida
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # SEC-FIX: headers de seguridad
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Content-Security-Policy "default-src 'self'" always;

    root /var/www/html;
    index index.php;

    # SEC-FIX: bloquea acceso directo a .env y archivos sensibles
    location ~ /\.(env|git) {
        deny all;
        return 404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    # Bloquea ejecucion de PHP en cualquier subcarpeta de uploads (defensa extra)
    location ~* /uploads/.*\.php$ {
        deny all;
        return 403;
    }
}
